version: '3.8'

services:
  bot:
    build: .
    container_name: friendship-flames-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/data/friendship_flames.db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
